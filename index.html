<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Task Claw</title>

<style>
body{
    margin:0;
    background:#8ed6ff;
    text-align:center;
    font-family:sans-serif;
}

canvas{
    background:white;
    border:4px solid black;
    margin-top:20px;
}

#ui{
    margin:10px;
}

input{
    width:300px;
    padding:8px;
}
</style>
</head>
<body>

<h1>🧸 Task Claw Machine</h1>

<div id="ui">
    <input id="taskInput" placeholder="Add a task">
    <button onclick="addTask()">Add Task</button>
    <button onclick="dropClaw()">DROP CLAW</button>
</div>

<canvas id="game" width="800" height="500"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let clawX = 400;
let clawY = 50;

let grabbing = false;

const prizes = [];
const stuffedAnimals = [
    "🧸", // teddy bear
    "🐰", // bunny
    "🐼", // panda
    "🐨", // koala
    "🐶", // puppy
    "🐱", // kitten
    "🦊", // fox
    "🐸", // frog
    "🐷", // pig
    "🐵", // monkey
    "🐯", // tiger
    "🦁", // lion
    "🐧", // penguin
    "🐙", // octopus
    "🦄"  // unicorn
];

function addTask(){

    const input = document.getElementById("taskInput");

    if(!input.value.trim()) return;

prizes.push({
    x: Math.random()*700 + 50,
    y: Math.random()*200 + 250,
    size: 40,
    task: input.value,
    animal: stuffedAnimals[
        Math.floor(Math.random() * stuffedAnimals.length)
    ],
    grabbed: false
});

    input.value="";
}

document.getElementById("taskInput").addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        addTask();
    }
});

document.addEventListener("keydown", e => {

    if(grabbing) return;

    if(e.key==="ArrowLeft")
        clawX-=25;

    if(e.key==="ArrowRight")
        clawX+=25;

});

document.addEventListener("keydown",e=>{

    if(grabbing) return;

    if(e.key==="ArrowLeft")
        clawX-=25;

    if(e.key==="ArrowRight")
        clawX+=25;

});

function dropClaw(){

    if(grabbing || prizes.length===0) return;

    grabbing=true;

	let target = null;
	const grabRange = 30; // pixels

	for (const p of prizes) {

		const distance = Math.abs(p.x - clawX);

		if (distance < grabRange) {
			target = p;
			break;
		}
	}

    const interval=setInterval(()=>{

        clawY+=10;

        if(clawY>350){

            clearInterval(interval);

            if (target) {

				alert(
					"🎉 TASK UNLOCKED:\n\n" +
					target.task
			);

		prizes.splice(
			prizes.indexOf(target),
			1
    );

} else {

    alert("❌ Missed! No animal was under the claw.");

}

            const up=setInterval(()=>{

                clawY-=10;

                if(clawY<=50){

                    clawY=50;
                    grabbing=false;
                    clearInterval(up);
                }

            },16);
        }

    },16);
}
function drawClaw(x, y) {

    ctx.strokeStyle = "#444";
    ctx.lineWidth = 4;

    // center connector
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x, y + 20);
    ctx.stroke();

    // left claw arm
    ctx.beginPath();
    ctx.moveTo(x, y + 20);
    ctx.lineTo(x - 15, y + 35);
    ctx.lineTo(x - 25, y + 25);
    ctx.stroke();

    // center claw arm
    ctx.beginPath();
    ctx.moveTo(x, y + 20);
    ctx.lineTo(x, y + 40);
    ctx.stroke();

    // right claw arm
    ctx.beginPath();
    ctx.moveTo(x, y + 20);
    ctx.lineTo(x + 15, y + 35);
    ctx.lineTo(x + 25, y + 25);
    ctx.stroke();

    // top housing
    ctx.fillStyle = "#888";
    ctx.fillRect(x - 12, y - 10, 24, 10);
}

function draw(){

    ctx.clearRect(0,0,800,500);

    ctx.fillStyle="black";

    ctx.fillRect(clawX-2,0,4,clawY);

	drawClaw(clawX, clawY);

for(const p of prizes){

    ctx.font = "40px serif";
    ctx.fillText(p.animal, p.x, p.y);
}

    requestAnimationFrame(draw);
}

draw();

</script>

</body>
</html>
