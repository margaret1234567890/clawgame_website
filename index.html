<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Task Claw</title>

<style>
body{
    margin:0;
    min-height:100vh;
    background-color:#8ed6ff;
    background-image:url("background.jpg");
    background-position:center;
    background-repeat:no-repeat;
    background-size:cover;
    background-attachment:fixed;
    text-align:center;
    font-family:sans-serif;
}

canvas{
    background:white;
    border:4px solid black;
    margin-top:20px;
}

#ui{
    margin:10px;
}

input{
    width:300px;
    padding:8px;
}

#welcome{
    color:#333;
    margin-top:-10px;
    margin-bottom:15px;
}
</style>
</head>
<body>

<h1>🧸 Task Claw Machine</h1>

<h2 id="welcome">👋 Welcome Back!</h2>

<div id="ui">
    <input id="taskInput" placeholder="Add a task">
    <button onclick="addTask()">Add Task</button>
    <button onclick="dropClaw()">DROP CLAW</button>
    <button onclick="clearScreen()">Clear Screen</button>
</div>

<canvas id="game" width="800" height="500"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let clawX = 400;
let clawY = 50;

const clawHalfWidth = 25;
const clawStep = 25;

let grabbing = false;
let clawGrip = 0;
let grabbedPrize = null;
let audioContext = null;

const storageKey = "taskClawPrizes";
const prizes = loadPrizes();
const stuffedAnimals = [
    "🧸", // teddy bear
    "🐰", // bunny
    "🐼", // panda
    "🐨", // koala
    "🐶", // puppy
    "🐱", // kitten
    "🦊", // fox
    "🐸", // frog
    "🐷", // pig
    "🐵", // monkey
    "🐯", // tiger
    "🦁", // lion
    "🐧", // penguin
    "🐙", // octopus
    "🦄"  // unicorn
];

function loadPrizes() {
    try {
        const savedPrizes = JSON.parse(localStorage.getItem(storageKey));
        return Array.isArray(savedPrizes) ? savedPrizes : [];
    } catch (error) {
        return [];
    }
}

function savePrizes() {
    localStorage.setItem(storageKey, JSON.stringify(prizes));
}

function getAudioContext() {
    if (!audioContext) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return null;
        audioContext = new AudioContextClass();
    }

    return audioContext;
}

function playTone(startFrequency, endFrequency, duration, type, volume, delay = 0) {
    const sound = getAudioContext();
    if (!sound) return;

    const startTime = sound.currentTime + delay;
    const oscillator = sound.createOscillator();
    const gain = sound.createGain();

    oscillator.type = type;
    oscillator.frequency.setValueAtTime(startFrequency, startTime);
    oscillator.frequency.exponentialRampToValueAtTime(endFrequency, startTime + duration);

    gain.gain.setValueAtTime(0.0001, startTime);
    gain.gain.exponentialRampToValueAtTime(volume, startTime + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

    oscillator.connect(gain);
    gain.connect(sound.destination);
    oscillator.start(startTime);
    oscillator.stop(startTime + duration);
}

function playGrabSound() {
    // A quick toy squeak followed by several short metallic clinks.
    playTone(550, 1200, 0.2, "sine", 0.22);
    playTone(1800, 900, 0.12, "triangle", 0.12, 0.12);
    playTone(2400, 1300, 0.1, "square", 0.06, 0.15);
    playTone(1400, 700, 0.14, "triangle", 0.1, 0.22);
}

function playMissSound() {
    // Two low pulses make a recognizable failure buzzer.
    playTone(180, 130, 0.28, "sawtooth", 0.16);
    playTone(160, 110, 0.32, "sawtooth", 0.16, 0.32);
}

function clearScreen() {
    if (grabbing) return;

    prizes.length = 0;
    savePrizes();
}

function addTask(){

    const input = document.getElementById("taskInput");

    if(!input.value.trim()) return;

prizes.push({
    x: Math.random()*700 + 50,
    y: Math.random()*200 + 250,
    size: 40,
    task: input.value,
    animal: stuffedAnimals[
        Math.floor(Math.random() * stuffedAnimals.length)
    ],
    grabbed: false
});

    savePrizes();
    input.value="";
}

document.getElementById("taskInput").addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        addTask();
    }
});

document.addEventListener("keydown", e => {
    if (grabbing || !["ArrowLeft", "ArrowRight", "ArrowDown"].includes(e.key)) {
        return;
    }

    // Keep arrow keys from scrolling the page while controlling the claw.
    e.preventDefault();

    if (e.key === "ArrowLeft") {
        clawX = Math.max(clawHalfWidth, clawX - clawStep);
    } else if (e.key === "ArrowRight") {
        clawX = Math.min(canvas.width - clawHalfWidth, clawX + clawStep);
    } else if (e.key === "ArrowDown") {
        dropClaw();
    }
});

function dropClaw() {
    if (grabbing || prizes.length === 0) return;

    grabbing = true;

    // Initialize audio during the key press or button click so browsers allow it.
    const sound = getAudioContext();
    if (sound && sound.state === "suspended") sound.resume();

	let target = null;
	const clawLeft = clawX - clawHalfWidth;
	const clawRight = clawX + clawHalfWidth;
	ctx.font = "40px serif";

	for (const p of prizes) {
		// p.x is the animal's left edge because fillText uses left alignment.
		// Compare the visible bounds instead of treating p.x as its center.
		const animalLeft = p.x;
		const animalRight = p.x + ctx.measureText(p.animal).width;

		if (clawRight >= animalLeft && clawLeft <= animalRight) {
			target = p;
			break;
		}
	}

    const down = setInterval(() => {
        clawY += 10;

        if (clawY >= 350) {
            clawY = 350;
            clearInterval(down);

            const close = setInterval(() => {
                clawGrip = Math.min(1, clawGrip + 0.1);

                if (clawGrip === 1) {
                    clearInterval(close);
                    grabbedPrize = target;

                    if (target) {
                        playGrabSound();
                    } else {
                        playMissSound();
                    }

                    const up = setInterval(() => {
                        clawY -= 10;

                        if (clawY <= 50) {
                            clawY = 50;
                            clearInterval(up);

                            if (target) {
                                prizes.splice(prizes.indexOf(target), 1);
                                savePrizes();
                            }

                            grabbedPrize = null;

                            const open = setInterval(() => {
                                clawGrip = Math.max(0, clawGrip - 0.1);

                                if (clawGrip === 0) {
                                    clearInterval(open);
                                    grabbing = false;

                                    if (target) {
                                        alert("🎉 TASK UNLOCKED:\n\n" + target.task);
                                    } else {
                                        alert("❌ Missed! No animal was under the claw.");
                                    }
                                }
                            }, 16);
                        }
                    }, 16);
                }
            }, 16);
        }
    }, 16);
}
function drawClaw(x, y) {

    ctx.strokeStyle = "#444";
    ctx.lineWidth = 4;

    // center connector
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x, y + 20);
    ctx.stroke();

    const elbowOffset = 15 - clawGrip * 8;
    const tipOffset = 25 - clawGrip * 20;

    // left claw arm
    ctx.beginPath();
    ctx.moveTo(x, y + 20);
    ctx.lineTo(x - elbowOffset, y + 35);
    ctx.lineTo(x - tipOffset, y + 25);
    ctx.stroke();

    // center claw arm
    ctx.beginPath();
    ctx.moveTo(x, y + 20);
    ctx.lineTo(x, y + 40);
    ctx.stroke();

    // right claw arm
    ctx.beginPath();
    ctx.moveTo(x, y + 20);
    ctx.lineTo(x + elbowOffset, y + 35);
    ctx.lineTo(x + tipOffset, y + 25);
    ctx.stroke();

    // top housing
    ctx.fillStyle = "#888";
    ctx.fillRect(x - 12, y - 10, 24, 10);
}

function draw(){

    ctx.clearRect(0,0,800,500);

    ctx.fillStyle="black";

    ctx.fillRect(clawX-2,0,4,clawY);

	drawClaw(clawX, clawY);

for(const p of prizes){

    if (p === grabbedPrize) continue;

    ctx.font = "40px serif";
    ctx.fillText(p.animal, p.x, p.y);
}

if (grabbedPrize) {
    ctx.font = "40px serif";
    const animalWidth = ctx.measureText(grabbedPrize.animal).width;
    ctx.fillText(grabbedPrize.animal, clawX - animalWidth / 2, clawY + 70);
}

    requestAnimationFrame(draw);
}

draw();

</script>

</body>
</html>
